# ── 내 정보 ───────────────────────────────────────────────
title: APapeIsName의 공부 기록
student: APapeIsName        # 리포트의 '제출자'로 표시돼요. 원하는 이름으로 바꾸세요
description: 현직 개발자가 공부하며 배운 것을 적는 기술 블로그. 1년짜리 CS 독학 과정의 계획서와 과제 리포트도 함께 올려요.
course_title: CS 기본기 독학 과정

# ── 과정 설정 ─────────────────────────────────────────────
course_start: 2026-11-16     # 개강일 (월요일 추천)
weekly_hours: 7              # 일주일에 공부할 시간. 일정 대비 진도 계산에 쓰여요
xp_per_hour: 10
xp_per_recall: 5
xp_per_level: 300

# ── 배포 설정 ─────────────────────────────────────────────
# 저장소 이름이 username.github.io 이면 baseurl은 "" 그대로 두세요.
# 다른 이름(예: cs-study)이면 baseurl: "/cs-study" 로 바꿔요.
url: "https://apapeisname.github.io"
baseurl: ""

# ── 글쓰기 서버 ───────────────────────────────────────────
# worker/ 폴더의 Cloudflare Worker 주소. 비워 두면 로그인 버튼이 숨겨져요.
# 예: https://cs-study-api.<내 계정>.workers.dev
api_base: "https://cs-study-api.apapeisname.workers.dev"

lang: ko
timezone: Asia/Seoul
markdown: kramdown
kramdown:
  input: GFM
permalink: /reports/:year/:month/:day/:title/

# 공부 노트: 과제와 상관없이 배운 것을 적는 글 (_notes 폴더)
collections:
  notes:
    output: true
    permalink: /notes/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: report
      section: course
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      section: notes

exclude:
  - README.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - worker
