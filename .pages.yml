        required: true
        description: "예: Malloc Lab 1차 제출, 명시적 가용 리스트로 바꾸기까지"
      - name: date
        label: 제출일
        type: date
        required: true
      - name: quest
        label: 과제
        type: select
        required: true
        description: 계획서의 과제 중 하나를 골라요. 시즌과 과목은 자동으로 붙어요.
