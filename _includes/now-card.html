{% assign ck_last = site.data.checkins | last %}
<section class="window now-card" id="now-card" aria-labelledby="now-title" aria-live="polite">
  <h2 id="now-title">오늘</h2>
  <div class="now-body" id="now-body">
    {% if ck_last %}
      <p class="now-line is-idle">마지막 출석: {{ ck_last.date | default: ck_last.start | slice: 0, 10 }}{% if ck_last.text %}, {{ ck_last.text }}{% endif %}</p>
    {% else %}
      <p class="now-line is-idle">아직 출석 기록이 없어요.</p>
    {% endif %}
  </div>
  <form class="now-form owner-only" id="now-form" hidden novalidate></form>
  <p class="more-links"><a href="{{ '/checkins/' | relative_url }}">출석부 보기</a></p>
</section>
