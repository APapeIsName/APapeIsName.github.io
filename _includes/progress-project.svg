{% comment %} 메인 프로젝트가 CS 과정이 아닐 때의 진도 카드. progress-card.svg 가 색(c_*)과 pj를 정해 두고 불러요. {% endcomment %}{% assign t_total = 0 %}{% assign t_done = 0 %}{% assign t_next = "" %}{% for t in pj.todos %}{% assign t_total = t_total | plus: 1 %}{% if t.done %}{% assign t_done = t_done | plus: 1 %}{% else %}{% if t_next == "" %}{% assign t_next = t.text %}{% else %}{% assign t_next = t_next | append: " / " | append: t.text %}{% endif %}{% endif %}{% endfor %}{% if t_total > 0 %}{% assign pct = t_done | times: 100 | divided_by: t_total %}{% assign bw = t_done | times: 600 | divided_by: t_total %}{% else %}{% assign pct = 0 %}{% assign bw = 0 %}{% endif %}{% assign pj_notes = site.notes | where: "series", pj.id %}{% assign pj_status = pj.status | default: "진행 중" %}<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="메인 프로젝트 {{ pj.title | escape }}: 할 일 {{ t_done }}/{{ t_total }}, 노트 {{ pj_notes.size }}편">
<!-- 픽셀 폰트: Galmuri (c) Lee Minseo (quiple), SIL Open Font License 1.1, https://github.com/quiple/galmuri -->
<style>{% include progress-font.css %} text{font-family:'Px',sans-serif}</style>
<polygon points="4,0 836,0 836,4 840,4 840,196 836,196 836,200 4,200 4,196 0,196 0,4 4,4" fill="{{ c_line }}"/>
<rect x="4" y="4" width="832" height="192" fill="{{ c_panel }}"/>
<rect x="4" y="4" width="832" height="104" fill="{{ c_band }}"/>
<text x="28" y="34" font-size="13" fill="{{ c_muted }}">메인 프로젝트</text>
<text x="812" y="34" font-size="12" text-anchor="end" fill="{{ c_muted }}">{{ site.time | date: "%-m월 %-d일" }} 기준</text>
<text x="28" y="64" font-size="20" fill="{{ c_text }}">{{ pj.title | truncate: 24, "…" | escape }}</text>
{% assign chips = "status,notes,todos" | split: "," %}{% for label in chips %}{% assign chx = forloop.index0 | times: 92 | plus: 540 %}<rect x="{{ chx }}" y="46" width="86" height="26" fill="{{ c_line }}"/><rect x="{{ chx | plus: 2 }}" y="48" width="82" height="22" fill="{% if label == 'status' and pj_status == '진행 중' %}{{ c_band }}{% else %}{{ c_panel }}{% endif %}"/><text x="{{ chx | plus: 43 }}" y="64" font-size="13" text-anchor="middle" fill="{{ c_text }}">{% if label == "status" %}{{ pj_status }}{% elsif label == "notes" %}노트 {{ pj_notes.size }}편{% else %}할 일 {{ t_done }}/{{ t_total }}{% endif %}</text>{% endfor %}
<rect x="28" y="84" width="44" height="18" fill="{{ c_line }}"/><text x="50" y="98" font-size="12" text-anchor="middle" fill="{{ c_gold }}">진행</text>
<rect x="80" y="84" width="604" height="18" fill="{{ c_line }}"/><rect x="82" y="86" width="600" height="14" fill="{{ c_faint }}"/>{% if bw > 0 %}<rect x="82" y="86" width="{{ bw }}" height="14" fill="{{ c_hp }}"/>{% endif %}
<text x="812" y="99" font-size="14" text-anchor="end" fill="{{ c_text }}">{{ pct }}%</text>
{% if pj.goal %}{% assign line1_label = "목표" %}{% assign line1 = pj.goal %}{% elsif pj.description %}{% assign line1_label = "소개" %}{% assign line1 = pj.description %}{% else %}{% assign line1_label = "목표" %}{% assign line1 = "아직 목표를 적지 않았어요" %}{% endif %}
{% if t_next != "" %}{% assign line2_label = "다음" %}{% assign line2 = t_next %}{% elsif pj.values %}{% assign line2_label = "가치관" %}{% assign line2 = pj.values | first %}{% elsif t_total > 0 %}{% assign line2_label = "다음" %}{% assign line2 = "할 일을 모두 마쳤어요" %}{% else %}{% assign line2_label = "다음" %}{% assign line2 = "할 일을 적으면 여기에 보여요" %}{% endif %}
<rect x="28" y="126" width="56" height="20" fill="{{ c_line }}"/><text x="56" y="141" font-size="12" text-anchor="middle" fill="{{ c_gold }}">{{ line1_label }}</text>
<text x="98" y="142" font-size="14" fill="{{ c_text }}">{{ line1 | truncate: 50, "…" | escape }}</text>
<rect x="28" y="158" width="56" height="20" fill="{{ c_line }}"/><text x="56" y="173" font-size="12" text-anchor="middle" fill="{{ c_gold }}">{{ line2_label }}</text>
<text x="98" y="174" font-size="14" fill="{{ c_muted }}">{{ line2 | truncate: 50, "…" | escape }}</text>
</svg>
