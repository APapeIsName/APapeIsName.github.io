{% comment %}
  GitHub 프로필 README에 넣는 진도 카드예요. 블로그가 빌드될 때마다(글을 올릴 때마다) 새로 그려져요.
  쓰기 전에 theme("light" 또는 "dark")를 정해 두세요.
  글꼴은 _includes/progress-font.css에 꼭 필요한 글자만 넣어 뒀어요. 시즌 이름을 바꾸면 그 파일도 다시 만들어야 해요.
{% endcomment %}{% if theme == "dark" %}{% assign c_line = "#5a77b0" %}{% assign c_panel = "#232d47" %}{% assign c_band = "#1d2a4a" %}{% assign c_edge = "#3b5a95" %}{% assign c_red = "#ff6a5c" %}{% assign c_text = "#e7edf8" %}{% assign c_muted = "#a5b2c9" %}{% assign c_faint = "#3a4766" %}{% assign c_hp = "#5fd17a" %}{% assign c_gold = "#ffd34d" %}{% else %}{% assign c_line = "#33415c" %}{% assign c_panel = "#fbfcfe" %}{% assign c_band = "#cfe6f7" %}{% assign c_edge = "#8cc3e8" %}{% assign c_red = "#e0483e" %}{% assign c_text = "#26324a" %}{% assign c_muted = "#4f5e78" %}{% assign c_faint = "#c5cfdd" %}{% assign c_hp = "#48b058" %}{% assign c_gold = "#f2b630" %}{% endif %}{% assign total = 0 %}{% assign done_n = 0 %}{% assign xp = 0 %}{% assign cur_code = "" %}{% assign cur_title = "" %}{% capture cells %}{% for s in site.data.seasons %}{% assign s_total = 0 %}{% assign s_done = 0 %}{% assign s_boss = false %}{% for q in site.data.quests %}{% if q.season == s.id %}{% assign q_done = false %}{% assign q_recall = false %}{% if q.done == "TRUE" %}{% assign q_done = true %}{% endif %}{% if q.recalled == "TRUE" %}{% assign q_recall = true %}{% endif %}{% for p in site.posts %}{% if p.quest == q.id %}{% assign rp = p %}{% assign rp_body = p.content %}{% include report-check.html %}{% if rc_complete %}{% assign q_done = true %}{% endif %}{% if p.recalled and rc_recall_ok %}{% assign q_recall = true %}{% endif %}{% endif %}{% endfor %}{% if q_done %}{% assign h = q.hours | times: 10 %}{% assign xp = xp | plus: h %}{% endif %}{% if q_recall %}{% assign xp = xp | plus: 5 %}{% endif %}{% if q.type != "사이드" %}{% assign s_total = s_total | plus: 1 %}{% assign total = total | plus: 1 %}{% if q_done %}{% assign s_done = s_done | plus: 1 %}{% assign done_n = done_n | plus: 1 %}{% endif %}{% endif %}{% if q.type == "보스" and q_done %}{% assign s_boss = true %}{% endif %}{% endif %}{% endfor %}{% assign i = forloop.index0 %}{% assign cx = i | times: 78 | plus: 32 %}{% assign is_cur = false %}{% if cur_code == "" and s_done < s_total %}{% assign cur_code = s.code %}{% assign cur_title = s.title %}{% assign is_cur = true %}{% endif %}{% if s_total > 0 %}{% assign fw = s_done | times: 58 | divided_by: s_total %}{% else %}{% assign fw = 0 %}{% endif %}
<g transform="translate({{ cx }},122)">{% if is_cur %}<rect x="-3" y="-3" width="80" height="62" fill="{{ c_red }}"/>{% endif %}<rect x="0" y="0" width="74" height="56" fill="{{ c_line }}"/><rect x="3" y="3" width="68" height="50" fill="{% if s_done == s_total and s_total > 0 %}{{ c_band }}{% else %}{{ c_panel }}{% endif %}"/><text x="37" y="22" font-size="13" text-anchor="middle" fill="{% if s_done > 0 or is_cur %}{{ c_text }}{% else %}{{ c_muted }}{% endif %}">{{ s.code }}{% if s_boss %} ★{% endif %}</text><rect x="8" y="34" width="58" height="8" fill="{{ c_faint }}"/>{% if fw > 0 %}<rect x="8" y="34" width="{{ fw }}" height="8" fill="{{ c_hp }}"/>{% endif %}<text x="37" y="51" font-size="9" text-anchor="middle" fill="{{ c_muted }}">{{ s_done }}/{{ s_total }}</text></g>{% endfor %}{% endcapture %}{% if total > 0 %}{% assign pct = done_n | times: 100 | divided_by: total %}{% assign bw = done_n | times: 600 | divided_by: total %}{% else %}{% assign pct = 0 %}{% assign bw = 0 %}{% endif %}{% assign lv = xp | floor | divided_by: 300 | plus: 1 %}<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="{{ site.course_title }} 진도 {{ pct }}%, 리포트 {{ site.posts.size }}편, 노트 {{ site.notes.size }}편">
<!-- 픽셀 폰트: Galmuri (c) Lee Minseo (quiple), SIL Open Font License 1.1, https://github.com/quiple/galmuri -->
<style>{% include progress-font.css %} text{font-family:'Px',sans-serif}</style>
<polygon points="4,0 836,0 836,4 840,4 840,196 836,196 836,200 4,200 4,196 0,196 0,4 4,4" fill="{{ c_line }}"/>
<rect x="4" y="4" width="832" height="192" fill="{{ c_panel }}"/>
<rect x="4" y="4" width="832" height="104" fill="{{ c_band }}"/>
<text x="28" y="34" font-size="13" fill="{{ c_muted }}">{{ site.course_title }}</text>
<text x="812" y="34" font-size="12" text-anchor="end" fill="{{ c_muted }}">{{ site.time | date: "%-m월 %-d일" }} 기준</text>
<text x="28" y="64" font-size="20" fill="{{ c_text }}">{% if cur_code != "" %}{{ cur_code }} {{ cur_title }} 수강 중{% else %}모든 시즌을 마쳤어요{% endif %}</text>
{% assign chips = "리포트,노트,레벨" | split: "," %}{% for label in chips %}{% assign chx = forloop.index0 | times: 92 | plus: 540 %}<rect x="{{ chx }}" y="46" width="86" height="26" fill="{{ c_line }}"/><rect x="{{ chx | plus: 2 }}" y="48" width="82" height="22" fill="{{ c_panel }}"/><text x="{{ chx | plus: 43 }}" y="64" font-size="13" text-anchor="middle" fill="{{ c_text }}">{% if label == "리포트" %}리포트 {{ site.posts.size }}편{% elsif label == "노트" %}노트 {{ site.notes.size }}편{% else %}Lv.{{ lv }}{% endif %}</text>{% endfor %}
<rect x="28" y="84" width="44" height="18" fill="{{ c_line }}"/><text x="50" y="98" font-size="12" text-anchor="middle" fill="{{ c_gold }}">진도</text>
<rect x="80" y="84" width="604" height="18" fill="{{ c_line }}"/><rect x="82" y="86" width="600" height="14" fill="{{ c_faint }}"/>{% if bw > 0 %}<rect x="82" y="86" width="{{ bw }}" height="14" fill="{{ c_hp }}"/>{% endif %}
<text x="812" y="99" font-size="14" text-anchor="end" fill="{{ c_text }}">{{ pct }}% ({{ done_n }}/{{ total }})</text>
{{ cells }}
</svg>
