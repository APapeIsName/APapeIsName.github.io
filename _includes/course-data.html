<script>
window.COURSE = {
  config: {
    start: {{ site.course_start | date: "%Y-%m-%d" | jsonify }},
    weeklyHours: {{ site.weekly_hours | default: 7 }},
    xpPerHour: {{ site.xp_per_hour | default: 10 }},
    xpPerRecall: {{ site.xp_per_recall | default: 5 }},
    xpPerLevel: {{ site.xp_per_level | default: 300 }},
    student: {{ site.student | jsonify }},
    syllabusUrl: {{ '/syllabus/' | relative_url | jsonify }},
    reportsUrl: {{ '/reports/' | relative_url | jsonify }},
    writeUrl: {{ '/write/' | relative_url | jsonify }},
    noteWriteUrl: {{ '/write/note/' | relative_url | jsonify }},
    notesUrl: {{ '/notes/' | relative_url | jsonify }},
    courseUrl: {{ '/course/' | relative_url | jsonify }},
    manageUrl: {{ '/manage/' | relative_url | jsonify }},
    checkinsUrl: {{ '/checkins/' | relative_url | jsonify }},
    projectsUrl: {{ '/projects/' | relative_url | jsonify }},
    linksUrl: {{ '/links/' | relative_url | jsonify }},
    projectUrl: {{ '/project/' | relative_url | jsonify }},
    courseTitle: {{ site.course_title | jsonify }},
    bgmYoutube: {{ site.bgm_youtube | default: "" | jsonify }},
    bgmYoutubeTitle: {{ site.bgm_youtube_title | default: "" | jsonify }},
    apiBase: {{ site.api_base | default: "" | jsonify }}
  },
  seasons: {{ site.data.seasons | jsonify }},
  quests: {{ site.data.quests | jsonify }},
  reportTemplate: {{ site.data.report_template | jsonify }},
  reports: [{% for p in site.posts %}{% assign rp = p %}{% assign rp_body = p.content %}{% include report-check.html %}
    {"date": {{ p.date | date: "%Y-%m-%d" | jsonify }}, "quest": {{ p.quest | jsonify }}, "complete": {% if p.complete %}true{% else %}false{% endif %}, "recalled": {% if p.recalled %}true{% else %}false{% endif %}, "hours": {{ p.hours | default: 0 }}, "title": {{ p.title | jsonify }}, "url": {{ p.url | relative_url | jsonify }}, "path": {{ p.path | jsonify }}, "missing": {{ rc_missing_keys | split: "|" | jsonify }}, "recallFilled": {{ rc_recall_ok }}}{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  notes: [{% assign notes_sorted = site.notes | sort: "date" | reverse %}{% for n in notes_sorted %}
    {"date": {{ n.date | date: "%Y-%m-%d" | jsonify }}, "title": {{ n.title | jsonify }}, "url": {{ n.url | relative_url | jsonify }}, "path": {{ n.path | jsonify }}, "series": {{ n.series | default: "" | jsonify }}, "quest": {{ n.quest | default: "" | jsonify }}, "tags": {% if n.tags %}{{ n.tags | jsonify }}{% else %}[]{% endif %}, "hours": {{ n.hours | default: 0 }}, "summary": {{ n.summary | default: "" | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  checkins: {% if site.data.checkins %}{{ site.data.checkins | jsonify }}{% else %}[]{% endif %},
  series: {% if site.data.series %}{{ site.data.series | jsonify }}{% else %}[]{% endif %},
  links: {% if site.data.links %}{{ site.data.links | jsonify }}{% else %}[]{% endif %},
  mainProject: {% include main-project.html %}{{ main_id | jsonify }},
  tags: {% if site.data.tags %}{{ site.data.tags | jsonify }}{% else %}[]{% endif %}
};
</script>
