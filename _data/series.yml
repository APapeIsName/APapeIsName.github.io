# 블로그 글쓰기 화면이나 관리 화면에서 바뀌어요. 직접 고쳐도 돼요.
- id: toby-spring
  title: 토비의 스프링 6
  description: 스프링의 핵심 원리를 DAO 리팩터링부터 차근차근 따라가요.
  link: https://www.inflearn.com/course/%ED%86%A0%EB%B9%84%EC%9D%98-%EC%8A%A4%ED%94%84%EB%A7%816-%EC%9D%B4%ED%95%B4%EC%99%80-%EC%9B%90%EB%A6%AC/dashboard?cid=332188
- id: testing
  title: 테스트 공부
  description: 좋은 테스트를 쓰는 법과 테스트 도구를 정리해요.
- id: spring-internals
  title: 스프링 구조 파기
  description: 질문 하나를 정하고 스프링 소스를 따라가며 확인해요. 토비의 스프링에서 생긴 궁금증을 여기서 풀어요.
  status: 진행 중
  goal: 스프링이 내 코드를 어떻게 실행하는지 소스로 확인하고, 작은 DI 컨테이너를 직접 만들어 보기
  todos:
    - text: "빈은 언제, 어떤 순서로 만들어지나? (ApplicationContext의 refresh 따라가기)"
    - text: "@Transactional을 붙이면 실제로 무슨 일이 일어나나? (프록시와 AOP)"
    - text: 요청 하나가 DispatcherServlet을 지나 컨트롤러까지 가는 길
    - text: 작은 DI 컨테이너 직접 만들기
- id: handmade-shell
  title: 맨손으로 쉘 만들기
  description: C로 시스템 콜을 직접 불러 가며 나만의 쉘을 만들어요.
  status: 진행 중
  goal: 파이프와 리다이렉션이 되는 쉘을 C로 직접 만들고, 프로세스가 어떻게 만들어지고 이어지는지 내 말로 설명하기
  todos:
    - text: 입력을 읽고 프로그램 하나 실행하기 (fork, exec, wait)
    - text: 내장 명령 cd, exit
    - text: 파이프 |
    - text: 리다이렉션 >, <
    - text: Ctrl+C 같은 시그널 처리
    - text: (선택) 백그라운드 실행과 작업 관리
