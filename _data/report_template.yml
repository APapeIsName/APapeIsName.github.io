# 과제 리포트 양식이에요. 글쓰기 화면, 리포트 화면, 진도 계산, 글쓰기 서버가 모두 이 파일을 봐요.
#
# sections: 리포트 칸 목록 (이 순서대로 보여요)
#   key          리포트 파일 머리말의 이름. body는 본문(정리)이에요.
#   title        칸 제목
#   required     true면 이 칸을 채워야 "과제 클리어"로 인정돼요.
#   placeholder  칸이 비어 있을 때 보이는 안내 문구. 아래 낱말은 과제 정보로 바뀌어요.
#                  {recall}   계획서의 인출 방법
#                  {resource} 계획서의 자료
#   rows         글쓰기 칸의 처음 높이 (줄 수)
#
# quest_placeholders: 과제마다 따로 쓰고 싶은 안내 문구. 과제 id 아래에 칸 key별로 적어요.
#   여기 적은 문구가 sections의 placeholder보다 먼저 쓰여요.
#
# 안내 문구는 칸에 미리 들어가는 글이 아니라, 비어 있을 때만 흐리게 보이는 글이에요.

sections:
  - key: goal
    title: 학습 목표
    required: false
    rows: 2
    placeholder: "이 과제를 마치면 무엇을 할 수 있게 되나요?"
  - key: recall_note
    title: 백지 인출 결과
    required: true
    rows: 5
    placeholder: "인출 방법: {recall}. 자료를 덮고 떠올린 것을 그대로 적어요. 틀려도 괜찮아요."
  - key: body
    title: 정리
    required: false
    rows: 12
    placeholder: "배운 내용을 내 말로 정리해요. 마크다운을 쓸 수 있어요. (## 소제목, **굵게**, `코드`, ``` 코드 블록)"
  - key: gaps
    title: 못 떠올린 것과 틀린 것
    required: true
    rows: 3
    placeholder: "자료({resource})와 대조해서 빠뜨렸거나 틀린 것을 적어요. 다 맞았다면 무엇을 확인했는지 적어요."
  - key: stuck
    title: 막힌 점과 해결
    required: false
    rows: 3
    placeholder: "어디서 막혔고 어떻게 풀었나요?"
  - key: next_steps
    title: 다음에 할 일
    required: false
    rows: 2
    placeholder: "- 다음 과제 읽기"

quest_placeholders:
  S0-69fab2:
    recall_note: "책을 덮고 떠올린 게임 규칙 5개를 여기에 그대로 적어보세요."
    gaps: "게임 규칙 페이지와 대조해서 빠뜨린 규칙을 적어보세요."
