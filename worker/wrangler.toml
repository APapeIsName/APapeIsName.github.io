# 학습 블로그 API (Cloudflare Worker)
# 설정 방법은 worker/README.md를 보세요.
name = "cs-study-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
# 블로그 주소. 끝에 / 없이.
BLOG_ORIGIN = "https://apapeisname.github.io"
# 내 GitHub 숫자 ID (https://api.github.com/users/APapeIsName 의 "id"). 이 계정만 글을 쓸 수 있어요.
OWNER_GITHUB_ID = "84262085"
# 글을 커밋할 저장소
REPO_OWNER = "APapeIsName"
REPO_NAME = "APapeIsName.github.io"
REPO_BRANCH = "main"
# GitHub OAuth App의 Client ID (공개돼도 되는 값)
GITHUB_CLIENT_ID = "Ov23lidAhwaKmLuWyfCL"
# 리포트 인터뷰에 쓸 Claude 모델. 더 싸게 쓰려면 "claude-haiku-5-5"
INTERVIEW_MODEL = "claude-sonnet-5-5"

# 비밀값은 여기에 쓰지 말고 `npx wrangler secret put 이름` 으로 넣어요.
#   GITHUB_CLIENT_SECRET  OAuth App의 Client secret
#   SESSION_SECRET        세션 토큰 서명 키 (아무도 모르는 긴 무작위 문자열)
#   GITHUB_REPO_TOKEN     블로그 저장소 전용 세분화 토큰 (Contents: Read and write)
#   ANTHROPIC_API_KEY     (선택) 리포트 인터뷰 AI용 Claude API 키. 없으면 인터뷰만 꺼져요.
# 인터뷰 모델은 위 [vars]의 INTERVIEW_MODEL 에서 바꿔요.
